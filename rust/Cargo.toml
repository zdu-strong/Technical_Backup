[package]
name = "my"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.3", features = ["full"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
futures = "0.3.34"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
async-recursion = "1.2.0"
strum = "0.27.2"
strum_macros = "0.27.2"
once_cell = "1.21.4"
serde_with = "3.24.0"
bigdecimal = { version = "0.4.11", features = ["serde-json"] }
derive_more = { version = "2.1.1", features = ["display"] }
async-trait = "0.1"
serde-aux = "4.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "form", "multipart"] }
reqwest-websocket = { version = "0.5.1", features = ["json"] }
base64 = "0.22.1"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
